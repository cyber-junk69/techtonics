<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",

                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden" style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(19,127,236)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col w-full max-w-2xl flex-1">
<header class="flex items-center justify-between whitespace-nowrap px-4 py-6 sm:px-10">
<div class="flex items-center gap-3 text-slate-800 dark:text-slate-200">
<div class="size-6 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-slate-50 text-xl font-bold leading-tight tracking-[-0.015em]">Home Helper</h2>
</div>
<div class="flex flex-1 justify-end gap-2">
</div>
</header>
<main class="flex flex-col flex-grow justify-center px-4 sm:px-10 pb-10">
<div class="w-full max-w-md mx-auto">
<h1 class="text-slate-900 dark:text-slate-50 tracking-tight text-3xl sm:text-4xl font-bold leading-tight text-center pb-3 pt-6">Welcome to Home Helper!</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pb-8 pt-1 text-center">Let's start by selecting your profession.</p>
<div class="flex flex-col gap-3 p-4">
<label class="flex items-center gap-4 rounded-xl border border-solid border-slate-300 dark:border-slate-700 p-4 cursor-pointer hover:border-primary dark:hover:border-primary transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">electrical_services</span>
<div class="flex grow flex-col">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal">Electrician</p>
</div>
<input value="electrician" class="h-5 w-5 border-2 border-slate-300 dark:border-slate-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 checked:focus:border-primary" name="profession-selection" type="radio"/>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-slate-300 dark:border-slate-700 p-4 cursor-pointer hover:border-primary dark:hover:border-primary transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">plumbing</span>
<div class="flex grow flex-col">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal">Plumber</p>
</div>
<input value="plumber" class="h-5 w-5 border-2 border-slate-300 dark:border-slate-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 checked:focus:border-primary" name="profession-selection" type="radio"/>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-slate-300 dark:border-slate-700 p-4 cursor-pointer hover:border-primary dark:hover:border-primary transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:checked]:ring-2 has-[:checked]:ring-primary/20">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">cleaning_services</span>
<div class="flex grow flex-col">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal">Cleaner</p>
</div>
<input value="cleaner" class="h-5 w-5 border-2 border-slate-300 dark:border-slate-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 checked:focus:border-primary" name="profession-selection" type="radio"/>
</label>
</div>
    <div class="flex px-4 py-6 justify-center">
    <button id="continueBtn" class="flex w-full max-w-xs cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-slate-50 text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors disabled:bg-slate-300 dark:disabled:bg-slate-700 disabled:text-slate-500 dark:disabled:text-slate-400 disabled:cursor-not-allowed">
    <span class="truncate">Continue</span>
    </button>
    </div>
</div>
</main>
<footer class="text-center p-4 sm:p-10 mt-auto">
<p class="text-xs text-slate-500 dark:text-slate-400">
                            © 2024 Home Helper. All rights reserved. <a class="text-primary hover:underline" href="#">Terms of Service</a>
</p>
</footer>
</div>
</div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('continueBtn');
  if (!btn) return;
  btn.addEventListener('click', function () {
    const sel = document.querySelector('input[name="profession-selection"]:checked');
    if (!sel) {
      alert('Please select a profession to continue.');
      return;
    }
    const val = sel.value;
    let dest = 'helperdash.html';
    if (val === 'electrician') dest = 'helperdashe.html';
    else if (val === 'plumber') dest = 'helpdashp.html';
    else if (val === 'cleaner') dest = 'helpdashc.html';

    // Optionally persist selected profession
    try {
      localStorage.setItem('userProfession', val);
    } catch (e) { /* ignore */ }

    window.location.href = dest;
  });
});
</script>

</body></html>
