<script>
// Populate empty cells with stored request data
function p() {
  // Get all stored requests
  const allRequests = JSON.parse(localStorage.getItem('allRequests') || '[]');
  const emptyRows = document.querySelectorAll('.empty-request-row');
  
  // Fill empty rows with stored requests
  let emptyIndex = 0;
  for (let i = 0; i < allRequests.length && emptyIndex < emptyRows.length; i++) {
    const req = allRequests[i];
    const row = emptyRows[emptyIndex];
    
    const serviceCell = row.querySelector('.service-cell');
    const requestIdCell = row.querySelector('.request-id-cell');
    const dateCell = row.querySelector('.date-cell');
    const statusCell = row.querySelector('.status-cell');
    
    if (serviceCell) serviceCell.textContent = req.jobTitle || '-';
    if (requestIdCell) requestIdCell.textContent = '#REQ-' + (req.requestId || '?');
    if (dateCell) dateCell.textContent = req.date || '-';
    if (statusCell) {
      const statusColor = getStatusColor(req.status);
      statusCell.innerHTML = `<span class="inline-flex items-center rounded-full ${statusColor.bg} px-2.5 py-0.5 text-xs font-medium ${statusColor.text}">${req.status || 'Unknown'}</span>`;
    }
    
    row.setAttribute('data-status', req.status || 'pending');
    row.classList.remove('empty-request-row');
    
    emptyIndex++;
  }
}

// Get color classes based on status
function getStatusColor(status) {
  switch ((status || '').toLowerCase()) {
    case 'pending':
      return { bg: 'bg-orange-100 dark:bg-orange-900/50', text: 'text-orange-800 dark:text-orange-300' };
    case 'assigned':
      return { bg: 'bg-blue-100 dark:bg-blue-900/50', text: 'text-blue-800 dark:text-blue-300' };
    case 'completed':
      return { bg: 'bg-green-100 dark:bg-green-900/50', text: 'text-green-800 dark:text-green-300' };
    default:
      return { bg: 'bg-gray-100 dark:bg-gray-900/50', text: 'text-gray-800 dark:text-gray-300' };
  }
}

// Apply filter to show rows by status
function f(filter) {
  const tbody = document.querySelector('tbody');
  if (!tbody) return;
  const rows = tbody.querySelectorAll('tr');
  rows.forEach(row => {
    const status = (row.getAttribute('data-status') || '').toLowerCase();
    if (filter === 'all') {
      row.style.display = '';
    } else {
      row.style.display = (status === filter) ? '' : 'none';
    }
  });

  // Update active button styling
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (btn.dataset.filter === filter) {
      btn.classList.remove('bg-white','dark:bg-neutral-800','border','border-neutral-300','dark:border-neutral-700');
      btn.classList.add('bg-primary/10','dark:bg-primary/20','text-primary');
    } else {
      btn.classList.remove('bg-primary/10','dark:bg-primary/20','text-primary');
      btn.classList.add('bg-white','dark:bg-neutral-800','border','border-neutral-300','dark:border-neutral-700');
    }
  });
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  p(); // populate table with stored requests
  f('all'); // show all requests by default
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      f(this.dataset.filter || 'all');
    });
  });
});
</script>
