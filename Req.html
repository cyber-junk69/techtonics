<main class="flex-1 p-8">
<div class="w-full max-w-3xl mx-auto">
<div class="mb-8">
<h2 class="text-neutral-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">Submit a New Service Request</h2>
<p class="text-neutral-500 dark:text-neutral-400 mt-1">Fill out the details below to find the right helper for your job.</p>
</div>
<div class="bg-white dark:bg-neutral-900/50 rounded-xl border border-neutral-300/70 dark:border-neutral-700/50 shadow-sm">
<div class="p-6 space-y-6">
<div>
<label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1.5" for="job-title">Job Title</label>
<input class="form-input w-full rounded-lg bg-white dark:bg-neutral-800 border-neutral-300 dark:border-neutral-700 focus:ring-primary/50 focus:border-primary placeholder:text-neutral-400 dark:placeholder:text-neutral-500 text-sm" id="job-title" placeholder="e.g., Fix leaky kitchen sink" type="text"/>
</div>
<script>
  // Wait for DOM, then wire validation + submit behavior
  document.addEventListener('DOMContentLoaded', function () {
    const submitBtn = document.getElementById('submitRequestBtn');
    const fields = {
      jobTitle: document.getElementById('job-title'),
      jobType: document.getElementById('job-type'),
      description: document.getElementById('description'),
      date: document.getElementById('date'),
      time: document.getElementById('time'),
      location: document.getElementById('location')
    };

    function getStoredName() {
      return (typeof userName !== 'undefined' && userName) ? userName : (typeof getUserName === 'function' ? getUserName() : '');
    }

    function formIsValid() {
      // require name and all fields (cost is optional)
      const name = getStoredName();
      if (!name) return false;
      if (!fields.jobTitle.value.trim()) return false;
      if (!fields.jobType.value.trim()) return false;
      if (!fields.description.value.trim()) return false;
      if (!fields.date.value) return false;
      if (!fields.time.value) return false;
      if (!fields.location.value.trim()) return false;
      return true;
    }

    function validateForm() {
      const valid = formIsValid();
      if (valid) {
        submitBtn.removeAttribute('disabled');
        submitBtn.setAttribute('aria-disabled', 'false');
        submitBtn.classList.remove('opacity-50');
      } else {
        submitBtn.setAttribute('disabled', '');
        submitBtn.setAttribute('aria-disabled', 'true');
      }
    }

    // Attach listeners to form fields to validate in real time
    Object.values(fields).forEach(el => {
      if (!el) return;
      el.addEventListener('input', validateForm);
      el.addEventListener('change', validateForm);
    });

    // Also validate when shared userName becomes available (in case set elsewhere)
    window.addEventListener('storage', validateForm);

    // initial validation
    validateForm();

    // Submit handler
    submitBtn.addEventListener('click', function (e) {
      e.preventDefault();
      if (!formIsValid()) {
        alert('Please complete all required fields (including your name).');
        return;
      }

      // Collect values
      const name = getStoredName();
      const payload = {
        name: name || '',
        jobTitle: fields.jobTitle.value.trim(),
        jobType: fields.jobType.value.trim(),
        description: fields.description.value.trim(),
        preferredDate: fields.date.value,
        preferredTime: fields.time.value,
        location: fields.location.value.trim(),
        cost: (document.getElementById('cost') || { value: '' }).value.trim()
      };

      // Generate a serial request ID
      let requestCounter = parseInt(localStorage.getItem('requestCounter') || '12347');
      requestCounter++;
      localStorage.setItem('requestCounter', requestCounter.toString());
      const requestId = requestCounter.toString();
      const today = new Date().toISOString().split('T')[0];

      // Store new request in localStorage for dashboard to pick up
      const newRequest = {
        jobTitle: payload.jobTitle,
        requestId: requestId,
        date: today
      };
      localStorage.setItem('newRequestToAdd', JSON.stringify(newRequest));

      // Attempt to save on server (best-effort) then redirect
      fetch('save_request.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.warn('save_request failed', err))
        .finally(() => {
          // Redirect user to customer dashboard
          window.location.href = 'costumerdash.html';
        });
    });
  });
</script>
<div>
